<text x="80" y="218" font-family="'Segoe UI','Inter',-apple-system,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="url(#accb)">AI Engineer  •  Full Stack Developer  •  Software Builder</text>
