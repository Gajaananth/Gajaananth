<rect x="41" y="41" width="1118" height="1" fill="#fff" opacity="0.35"/>
<rect x="80" y="82" width="196" height="30" rx="15" fill="#fff" fill-opacity="0.07" stroke="#fff" stroke-opacity="0.2"/>
